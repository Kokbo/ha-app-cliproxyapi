name: Image scan

# Scans the built add-on image with Trivy: the Alpine packages from the Home
# Assistant base image, and the Go modules and Go stdlib compiled into the
# CLIProxyAPI binary. Report-only: findings go to Security -> Code scanning and
# never fail the run, so an unfixed upstream CVE can't block the daily
# upstream updates.
#
# Kept out of ci.yaml because uploading results needs security-events: write,
# which update-upstream.yaml's call into ci.yaml doesn't grant. Also runs daily:
# new CVEs are published without the image changing, and commits pushed by
# update-upstream.yaml (GITHUB_TOKEN) don't trigger push workflows.

on:
  push:
    branches: [main]
    paths:
      - "cliproxyapi/**"
      - ".github/workflows/image-scan.yaml"
  pull_request:
    paths:
      - "cliproxyapi/**"
      - ".github/workflows/image-scan.yaml"
  schedule:
    - cron: "41 5 * * *" # 05:41 UTC, after the 03:17 upstream update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # aarch64 has the same packages and Go modules, so one arch is enough.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./cliproxyapi
          platforms: linux/amd64
          load: true
          push: false
          tags: local/cliproxyapi:scan
          build-args: |
            BUILD_ARCH=amd64
          cache-from: type=gha,scope=cliproxyapi-amd64

      # Pinned to a commit: trivy-action's tags were hijacked in March 2026.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/cliproxyapi:scan
          scanners: vuln
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif

      # Fork PRs get a read-only token and can't upload.
      - name: Upload to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
