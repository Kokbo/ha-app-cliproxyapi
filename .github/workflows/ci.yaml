name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to test (empty = the selected branch)
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit SHA to test (empty = the caller's ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Add-on linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./cliproxyapi

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Syntax and shellcheck
        run: |
          mapfile -t files < <(ls .github/scripts/*.sh \
            cliproxyapi/rootfs/etc/cont-init.d/* \
            cliproxyapi/rootfs/etc/services.d/*/run \
            cliproxyapi/rootfs/usr/local/bin/*)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck --shell=bash "${files[@]}"
          echo "Checked ${#files[@]} scripts"
      - name: Test update-upstream.sh with sample data
        run: .github/scripts/test-update-upstream.sh
      - name: Run update-upstream.sh against upstream (dry run)
        env:
          DRY_RUN: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/update-upstream.sh

  workflow-lint:
    name: Workflow and Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Container actions pinned by digest; Renovate updates tag and digest.
      # The actionlint image bundles shellcheck for run: blocks.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: hadolint
        uses: docker://ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        with:
          args: /bin/hadolint cliproxyapi/Dockerfile

  build:
    name: Build and start (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The base image is the BUILD_FROM default in the Dockerfile, exactly as
      # the Supervisor builds it (build.yaml is deprecated).
      - name: Read build settings
        id: info
        run: |
          version="$(sed -nE 's/^version: "?([^"]+)"?$/\1/p' cliproxyapi/config.yaml)"
          upstream="$(sed -nE 's/^ARG CLIPROXYAPI_VERSION=(.*)$/\1/p' cliproxyapi/Dockerfile)"
          base="$(sed -nE 's/^ARG BUILD_FROM=(.*)$/\1/p' cliproxyapi/Dockerfile)"
          test -n "$base" || { echo "::error::no ARG BUILD_FROM default in Dockerfile"; exit 1; }
          grep -qE '^  - ${{ matrix.arch }}$' cliproxyapi/config.yaml \
            || { echo "::error::${{ matrix.arch }} is not in config.yaml arch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App $version, CLIProxyAPI $upstream, base $base"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./cliproxyapi
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: local/cliproxyapi:${{ matrix.arch }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}
          cache-from: type=gha,scope=cliproxyapi-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cliproxyapi-${{ matrix.arch }}

      - name: Start add-on and wait until /healthz answers and Docker reports healthy
        run: |
          data="$RUNNER_TEMP/data" config="$RUNNER_TEMP/config"
          mkdir -p "$data" "$config"
          echo '{}' > "$data/options.json"
          docker run -d --name addon --platform ${{ matrix.platform }} \
            -p 127.0.0.1:8317:8317 -v "$data:/data" -v "$config:/config" \
            local/cliproxyapi:${{ matrix.arch }}
          port_ok=false
          for i in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' addon)" != true ]; then
              echo "::error::container exited"; exit 1
            fi
            if ! $port_ok && curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8317/healthz; then
              port_ok=true; echo "/healthz answered after ~$((i * 2))s"
            fi
            health="$(docker inspect -f '{{.State.Health.Status}}' addon)"
            if $port_ok && [ "$health" = healthy ]; then
              echo "HEALTHCHECK healthy after ~$((i * 2))s"
              sudo test -s "$config/cliproxyapi/config.yaml" \
                || { echo "::error::config.yaml was not seeded"; exit 1; }
              exit 0
            fi
            [ "$health" = unhealthy ] && { echo "::error::HEALTHCHECK reports unhealthy"; docker inspect -f '{{json .State.Health}}' addon; exit 1; }
            sleep 2
          done
          echo "::error::not healthy within 240s (port_ok=$port_ok, health=$health)"
          exit 1

      - name: Container log
        if: always()
        run: docker logs addon 2>&1 || true
