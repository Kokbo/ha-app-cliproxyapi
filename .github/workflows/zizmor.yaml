name: zizmor

# Static analysis of the GitHub Actions workflows (injection, credential
# persistence, unpinned actions, over-broad permissions). Results go to
# Security -> Code scanning (category "zizmor"). Weekly too, because online
# audits check for newly published advisories against pinned actions.

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fork PRs get a read-only token, so they skip the SARIF upload and
      # just fail on findings instead.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # renovate: datasource=pypi depName=zizmor
          version: "1.32.0"
          persona: regular
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
